name: Update Profile Images

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#7C3AED
            profile/snake-dark.svg?palette=github-dark&color_snake=#A78BFA

      - name: Generate 3D contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate light stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&title_color=7C3AED&icon_color=8B5CF6&text_color=334155&bg_color=F8FAFC&card_width=480&disable_animations=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&title_color=A78BFA&icon_color=C4B5FD&text_color=C9D1D9&bg_color=0D1117&card_width=480&disable_animations=true
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate light language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&title_color=7C3AED&text_color=334155&bg_color=F8FAFC&card_width=480&disable_animations=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&title_color=A78BFA&text_color=C9D1D9&bg_color=0D1117&card_width=480&disable_animations=true
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Save profile images
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update generated profile images
          file_pattern: >-
            profile/snake.svg
            profile/snake-dark.svg
            profile/stats.svg
            profile/stats-dark.svg
            profile/top-langs.svg
            profile/top-langs-dark.svg
            profile-3d-contrib/profile-green.svg
            profile-3d-contrib/profile-night-green.svg
